# sandboxd example configuration.
# Copy to config.yaml and edit. `config.yaml` is gitignored.

server:
  # Address the HTTP server listens on.
  addr: "127.0.0.1:8080"

storage:
  # Root directory for workspace data, run logs and JSON metadata.
  data_dir: "./data"

# Runtime isolation.
sandbox:
  # Path to the nsjail binary. If missing, /readyz reports 503.
  nsjail_path: "nsjail"
  # Host user/group the sandboxed process runs as.
  user: "sandbox"
  group: "sandbox"
  # Grace period between SIGTERM and SIGKILL when stopping a process tree.
  kill_grace_sec: 3

# Default per-workspace resource limits (overridable per workspace).
limits:
  cpu_cores: 1
  memory_mb: 512
  disk_mb: 1024
  max_wall_time_sec: 300
  max_runs: 3
  allow_net: false
  # Default workspace opt-in for wall-clock-unbounded runs (no_timeout:true).
  # A run is unbounded only if BOTH this workspace-level value and the
  # server-level max_limits.allow_unlimited_runs are true. Default false (deny):
  # a workspace cannot ask for unlimited by omission.
  allow_unlimited_runs: false
  # Default workspace opt-in for quick Cloudflare tunnels. A tunnel is created
  # only if BOTH this workspace-level value and the server-level
  # tunnels.enabled are true; a tunnel also needs allow_net (cloudflared must
  # reach Cloudflare). Default false (deny).
  allow_tunnels: false

# Server-level maxima. No workspace may exceed these at creation or via PATCH;
# a request above a maximum is rejected with 422 (never silently clamped).
max_limits:
  cpu_cores: 8
  memory_mb: 8192
  disk_mb: 51200
  max_wall_time_sec: 3600
  max_runs: 64
  allow_net: true
  # Server-level switch an operator uses to forbid wall-clock-unbounded runs
  # everywhere. When false, no workspace may request `no_timeout:true`; when
  # true, an individual workspace still has to opt in via its own
  # limits.allow_unlimited_runs (or a PATCH). Default false (deny).
  allow_unlimited_runs: false

# Output and body caps (bytes / sizes). These are hard ceilings.
caps:
  exec_stdout_kb: 256
  exec_stderr_kb: 256
  run_log_mb: 10
  json_body_mb: 1
  upload_mb: 50
  file_read_mb: 5
  file_write_mb: 10
  file_list_max: 1000

# Two-tier Python packages.
#
# Shared tier: one host directory installed once, bind-mounted read-only into
# every sandbox so common/heavy dependencies are not duplicated per workspace.
# If the directory is missing, empty or unreadable the service degrades to the
# per-workspace private tier and runs still work.
packages:
  shared_dir: "/opt/sandboxd/packages"
  shared_enabled: true
  # Optional requirements file documenting what the shared image should contain.
  # Informational only; the service never installs from it.
  shared_requirements: "/opt/sandboxd/requirements-shared.txt"
  # Wall-clock bound and captured-output cap for a single pip install.
  install_timeout_sec: 120
  install_output_kb: 256

# Server-side interactive terminal sessions.
#
# A session runs a real PTY inside the workspace's nsjail sandbox. The service
# relays input/signal/resize through a line-delimited JSON control protocol to
# a PTY helper and streams the PTY's output to a capped log file (reusing the
# run-log mechanism). Every key below has a safe default, so the service starts
# with none of them set.
sessions:
  # Maximum concurrent sessions (running or still-recorded) per workspace.
  max_per_workspace: 4
  # End a session after this many seconds without activity (input, signal,
  # resize or output). Terminal status timed_out, reason idle_timeout.
  idle_timeout_sec: 900
  # Absolute wall-clock lifetime in seconds; ends with status timed_out and
  # reason lifetime regardless of activity.
  lifetime_sec: 3600
  # Cap on the persisted PTY output log per session. Past it bytes are dropped
  # and the session is marked output_truncated.
  output_kb: 1024
  # Maximum input payload accepted by a single input request.
  max_input_kb: 64
  # Default shell run inside the sandbox when a create request omits one.
  shell: "/bin/sh"
  # SIGHUP -> SIGKILL grace applied when a session is closed or times out.
  kill_grace_sec: 3
  # How long a session create waits for a relay that dies at startup (e.g. it
  # cannot allocate a PTY) so the response can report the session already
  # failed instead of running. Short: a healthy shell is not delayed by it.
  start_probe_ms: 250

# Per-workspace egress (allow_net).
#
# Egress is delivered by chained slirp4netns instances over UNIX sockets: an
# engine-owned "relay" namespace is connected to the host by one slirp4netns,
# and each workspace namespace is connected to the relay by a second. This
# creates ZERO host interfaces and ZERO host routes, and the relay blackholes
# every operator-private range, so a workspace can reach the public internet
# and a public resolver but never the host LAN, the host's own services, or
# another workspace. Default-deny: with enabled:false, allow_net workspaces get
# a private empty namespace (no egress) and never the host network.
network:
  enabled: false
  # Where the engine's namespaces are bind-mounted. The engine never uses
  # `ip netns add` (it is broken on some hosts): it creates namespaces with
  # unshare and bind-mounts them here.
  netns_dir: "/run/netns"
  # Name of the shared intermediate namespace.
  relay_netns: "sbxdrelay"
  # The slirp4netns binary. It is the only path a workspace has to the
  # internet; it speaks to its parent over a UNIX socket.
  slirp_path: "slirp4netns"
  mtu: 65520
  # Public resolvers written into an allow_net workspace's /etc/resolv.conf.
  # The host's own resolver is deliberately never published to a workspace.
  resolver: ["1.1.1.1", "8.8.8.8"]
  # How long a slirp instance is given to configure its interface.
  start_timeout_ms: 5000
  # Optional outbound proxy for a workspace's egress (http:// or socks5://).
  # DEFAULT EMPTY (off). With it off a workspace egresses through the platform's
  # shared NAT, whose address is registered to the hosting provider and names
  # them (AS/org/registry/country); see docs/DECISIONS.md ADR 76. Setting a
  # proxy CHANGES THE OUTBOUND ADDRESS and therefore the operator's
  # abuse/reputation profile, so it is the operator's explicit decision, never a
  # default. It is a soft mechanism: it is injected as the standard
  # HTTP(S)_PROXY/ALL_PROXY environment variables, so a program that ignores
  # them, or opens an address directly, is not constrained by it.
  egress_proxy: ""
  # Egress decoy: answer a workspace's attempts to learn its own public IP with
  # a plausible invented identity, while ordinary internet (pip/npm/github) is
  # untouched. DEFAULT OFF: nothing changes unless enabled is true. This is a
  # DECOY, not a security boundary: a tenant who controls their own endpoint
  # reads the real peer address in their own logs and cannot be stopped; see
  # docs/EGRESS-DECOY.md and docs/DECISIONS.md ADR 84. The one-line enable:
  #
  #   network: { decoy: { enabled: true } }
  decoy:
    enabled: false
    # The address range the per-workspace decoy address is drawn from. The
    # documentation range is the safe default (a real dotted quad that resolves
    # to nothing); a knowledgeable tenant can recognise it, so an operator may
    # prefer a range he owns.
    address_range: "198.51.100.0/24"
    # The shared decoy identity served by EVERY covered channel (address, org,
    # ASN text, city, country, region, reverse-DNS), so no channel contradicts
    # another -- a mismatch teaches a tenant more than the truth would.
    org: "Example Transit Networks"
    asn: "AS64500"
    city: "Frankfurt"
    country: "DE"
    region: "Hesse"
    rdns: "example-transit.net"
    # In-namespace ports the stubs bind; the in-namespace nft rules redirect
    # 53/80/443/853 to them. Change only if these collide.
    resolver_port: 15353
    http_port: 18080
    https_port: 18443
    # Extra hostnames (exact, or ".suffix" for a suffix) or regular expressions
    # to intercept, beyond the built-in shape patterns.
    extra_hosts: []
    extra_patterns: []

# Quick Cloudflare tunnels (one command -> public URL).
#
# A tunnel exposes one workspace port to the public internet with cloudflared,
# run INSIDE the workspace's own namespace. Quick tunnels need no Cloudflare
# account and no token: cloudflared prints a random
# https://<name>.trycloudflare.com URL. Default-deny: a tunnel needs
# tunnels.enabled AND the workspace's limits.allow_tunnels (and allow_net).
tunnels:
  enabled: false
  # Maximum concurrent tunnels per workspace.
  max_per_workspace: 2
  # How long to wait for cloudflared to print its public URL. The engine never
  # fabricates a URL: if none is observed within this bound the create fails
  # with 504 tunnel_url_unavailable.
  url_timeout_sec: 45
  # The cloudflared binary. The engine runs it from the host inside the
  # workspace's network namespace. With identity.hide_provider_tools on (the
  # default) it is NOT on PATH inside the workspace: the curated /usr/local does
  # not carry it, and a workspace starts tunnels through the API instead.
  cloudflared_path: "cloudflared"

# Host-identity masking.
#
# Hiding /proc and /sys (the mount namespace) closes the filesystem view, but a
# set of facts stays reachable by SYSCALL and identifies the host: the kernel
# release/version (uname), the HOST's real cpu count and total RAM (sysconf,
# sysinfo), and the base image's distro patch level (gnu_get_libc_version,
# confstr). Masking is a small LD_PRELOAD shim, reached for every
# dynamically-linked exec through a read-only /etc/ld.so.preload, that answers
# with the WORKSPACE's own limits instead. It is ON by default; turning it off
# is a diagnostic state that deliberately leaks.
#
# Honest limits (documented, not implied away): a statically-linked binary, a
# musl runtime (which does not read /etc/ld.so.preload), a raw syscall(2), or a
# handle-scoped dlvsym(3) bypasses the shim. The shim ALSO hides the mechanism
# itself from the workspace (the shim, /etc/ld.so.preload and the legacy engine
# dirs report ENOENT to ls/cat/stat/test/find and Python), while the loader still
# reads the preload list, so the mask keeps working (ADR 79). Masking is
# defense-in-depth, not a security boundary; the /proc and /sys views remain
# hidden by the mount namespace. See docs/DECISIONS.md.
identity:
  # Opt-out switch (default true). Set false only to measure what leaks.
  enabled: true
  # Select the workspace-PROFILE tool model (default true). With it on, a
  # workspace's whole /usr is replaced by a tree materialized from the
  # workspace's profile: ONLY the commands the profile names (an explicit
  # allowlist) plus engine base commands, the shared libraries, the ELF loader
  # and /usr/lib/ssl. Un-allowlisted host material (apt, the gcc/binutils chain,
  # /usr/include, /usr/libexec, the platform's /usr/local tooling) simply does
  # not exist inside the workspace. The engine's engine/platform name+content
  # filter still applies on top: a profile entry whose name or content names the
  # engine or platform is refused (fail loud), never silently shipped. Set
  # false only to see the host /usr unchanged (a diagnostic state that
  # deliberately exposes the platform's tooling).
  hide_provider_tools: true
  # Host filesystem root the curated trees are read from. Empty (the normal
  # case) reads the real host. It exists so a test can point materialization at
  # a small fixture tree.
  tools_root: ""
  # The kernel strings a workspace is told. They must never be a real kernel and
  # must not name the engine (a tenant reads them back).
  kernel_release: "0.0.0-sandbox"
  kernel_version: "#1 SMP"
  # Optional override of the compiled shim path; empty uses the copy embedded in
  # the binary (written to the service tmp dir and bind-mounted read-only).
  shim_path: ""

# Named workspace profiles: an explicit, reviewable allowlist of the tools (and
# the data/library trees those tools need) a workspace gets. A workspace names
# the profile it wants at creation; the default is used when it names none.
#
# The profiles themselves are data files (configs/profiles/*.yaml, embedded in
# the binary). Built in: `python` (Python 3.12 + pip/venv + Node + Perl + git +
# common tools) and `minimal` (POSIX shell + coreutils only). Adding a language
# means adding a file, never editing the engine.
profiles:
  # Optional directory of additional/override profile YAML files. Each file's
  # stem must equal its `name`; a file overlays a same-named built-in or adds a
  # new profile. Empty uses only the built-ins.
  dir: ""
  # Profile a workspace gets when its create request names none. Must be loaded.
  default: "python"

# Per-workspace limits: what a workspace SEES must equal what it is ALLOWED.
#
# With this ON (the default), a tenant runs `df -h` and sees its OWN disk
# allowance and `free -h`/`/proc/meminfo` its OWN memory, and cannot exceed
# either. During a run, `/workspace` is a real per-workspace ext4 filesystem
# image sized to the workspace's disk_mb, mounted HOST-SIDE with fuse2fs (the
# workspace needs no /dev/fuse inside). The limit is a kernel filesystem
# boundary: a write past it fails with ENOSPC, with no overshoot, and
# df/stat -f/os.statvfs() are all correct for free because the mounted
# filesystem IS the allowance. /proc is NOT the real procfs (mount_proc stays
# false); a curated, per-workspace payload is bound over it carrying only the
# workspace's own facts.
disk:
  # Server switch. true (the default) provisions the per-workspace filesystem
  # and the curated /proc. false disables both (a diagnostic state in which the
  # disk allowance is neither reported as the workspace's own nor enforced).
  enabled: true
  # Enforcement backend:
  #   fuse    -- real per-workspace ext4 image (fuse2fs). Kernel boundary; the
  #              strongest mechanism. Default when available.
  #   counter -- the engine's used-bytes watchdog. REAL but SAMPLED: a running
  #              process can overshoot before the next poll (see DECISIONS #85).
  #   auto    -- fuse when the host supports it, else counter. (default)
  #   none    -- no disk enforcement.
  backend: "auto"
  # Optional overrides for the image tools; empty uses the conventional name on
  # PATH (fuse2fs, mkfs.ext4, resize2fs, fusermount3).
  fuse2fs_path: ""
  mkfs_ext4_path: ""
  resize2fs_path: ""
  fusermount_path: ""
  # How often the counter watchdog audits a workspace's usage and stops an
  # over-limit run (ms). Smaller is a tighter overshoot bound and more CPU.
  counter_poll_ms: 500
  # Serve the curated per-workspace /proc payload (meminfo/cpuinfo/stat/uptime/
  # loadavg/version/vmstat/mounts plus self/limits), so free -h, uptime and a
  # bare df report the workspace's own resources. It is mounted only when
  # host-identity masking is also on, so the two channels can never disagree.
  proc_enabled: true

# Workspace subscriptions: a running term with an ABSOLUTE expiry instant.
#
# This is an ENGINE feature, not a billing feature. The engine owns the clock and
# the enforcement and stores absolute instants (never a "days remaining"
# counter); a separate product owns WHY a term is what it is (a renewal is the
# client sending a new/extended expiry). Because every value is absolute, state
# is recomputed from stored times after a restart and is never held in memory.
#
# DEFAULTS CHANGE NOTHING: default_duration is EMPTY, so a workspace that does
# not ask for a term gets NO expiry and is never locked or deleted. The reaper is
# a no-op for a workspace without an expiry.
subscription:
  # Reaper switch. true (the default) runs one periodic loop (beside the disk
  # watchdog) that locks a lapsed term and deletes it after the grace period.
  # false = nothing is ever automatically locked or deleted; per-request terms
  # are still accepted and still enforce on read (a lapsed workspace reads
  # `locked`), but no resource teardown happens.
  enabled: true
  # The term a workspace gets when its create names no subscription. Empty (the
  # default) means NO expiry: behaviour is unchanged for a workspace that does
  # not ask. A non-empty value (e.g. "30d") makes every new workspace get that
  # term unless the request overrides it with a duration or an absolute
  # expires_at. Grammar: s m h d w mo y, summed (e.g. "1d12h"); a bare integer is
  # refused. `mo`=30d and `y`=365d are FIXED-LENGTH approximations, never
  # calendar-exact.
  default_duration: ""
  # Server ceiling on a term, measured from now. A create/extend whose expiry
  # would land further out is refused with 422 max_duration_exceeded.
  max_duration: "365d"
  # How long a lapsed workspace stays LOCKED (service stopped, data and disk
  # image intact) before the reaper deletes it. Default 168h = 7 days.
  grace_period: "168h"
  # How often the reaper tick runs.
  reap_interval: "60s"

# Static API keys. Each entry maps a key to a principal_id.
# Multiple keys may share a principal_id.
keys:
  - key: "dev-key-please-rotate"
    principal_id: "user_dev"
