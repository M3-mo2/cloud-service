openapi: 3.1.0
info:
  title: sandboxd API
  version: 0.0.5
  description: |
    Secure per-user code execution backend. All `/v1` endpoints require a
    static bearer API key. All timestamps are RFC3339 UTC.
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: Meta
  - name: Workspaces
  - name: Files
  - name: Exec
  - name: Runs

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: gethealthz
      tags: [Meta]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      operationId: getreadyz
      tags: [Meta]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
  /metrics:
    get:
      operationId: getmetrics
      tags: [Meta]
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema: { type: string }
  /v1/meta:
    get:
      operationId: getv1_meta
      tags: [Meta]
      summary: Service metadata
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/workspaces:
    post:
      operationId: postv1_workspaces
      tags: [Workspaces]
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties:
                  workspace: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
    get:
      operationId: getv1_workspaces
      tags: [Workspaces]
      summary: List the caller's workspaces
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getv1_workspaces_workspaceId
      tags: [Workspaces]
      summary: Get a workspace
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties:
                  workspace: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deletev1_workspaces_workspaceId
      tags: [Workspaces]
      summary: Delete a workspace and all its runs/files
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workspaces/{workspaceId}/files:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getv1_workspaces_workspaceId_files
      tags: [Files]
      summary: List a directory
      parameters:
        - name: path
          in: query
          schema: { type: string, default: "/" }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      operationId: deletev1_workspaces_workspaceId_files
      tags: [Files]
      summary: Delete a file or directory
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/workspaces/{workspaceId}/files/content:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getv1_workspaces_workspaceId_files_content
      tags: [Files]
      summary: Read a file
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
        - name: encoding
          in: query
          schema: { type: string, enum: [text, base64] }
        - name: meta
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: File bytes or JSON metadata wrapper
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: "#/components/schemas/FileContentMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    put:
      operationId: putv1_workspaces_workspaceId_files_content
      tags: [Files]
      summary: Write a file
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutFileRequest" }
      responses:
        "204": { description: Written }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "507": { $ref: "#/components/responses/InsufficientStorage" }
  /v1/workspaces/{workspaceId}/files/mkdir:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: postv1_workspaces_workspaceId_files_mkdir
      tags: [Files]
      summary: Create a directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
      responses:
        "201": { description: Created }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/workspaces/{workspaceId}/files/rename:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: postv1_workspaces_workspaceId_files_rename
      tags: [Files]
      summary: Rename or move a path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string }
                to: { type: string }
      responses:
        "204": { description: Renamed }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/workspaces/{workspaceId}/files/upload:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: postv1_workspaces_workspaceId_files_upload
      tags: [Files]
      summary: Upload a file (multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [path, file]
              properties:
                path: { type: string }
                file: { type: string, format: binary }
      responses:
        "201": { description: Uploaded }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "507": { $ref: "#/components/responses/InsufficientStorage" }

  /v1/workspaces/{workspaceId}/exec:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: postv1_workspaces_workspaceId_exec
      tags: [Exec]
      summary: Run a command synchronously
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecResult" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/workspaces/{workspaceId}/runs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: postv1_workspaces_workspaceId_runs
      tags: [Runs]
      summary: Start an asynchronous run
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRunRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      operationId: getv1_workspaces_workspaceId_runs
      tags: [Runs]
      summary: List runs
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/workspaces/{workspaceId}/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getv1_workspaces_workspaceId_runs_runId
      tags: [Runs]
      summary: Get a run
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{workspaceId}/runs/{runId}/stop:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: postv1_workspaces_workspaceId_runs_runId_stop
      tags: [Runs]
      summary: Stop a run (idempotent)
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{workspaceId}/runs/{runId}/logs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getv1_workspaces_workspaceId_runs_runId_logs
      tags: [Runs]
      summary: Poll run logs
      parameters:
        - name: stream
          in: query
          schema: { type: string, enum: [stdout, stderr], default: stdout }
        - name: offset
          in: query
          schema: { type: integer, format: int64, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, format: int64, default: 65536 }
      responses:
        "200":
          description: Log chunk
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogChunk" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, pattern: "^ws_[0-9A-HJKMNP-TV-Z]{26}$" }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, pattern: "^run_[0-9A-HJKMNP-TV-Z]{26}$" }
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Caller does not own the resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Validation:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unprocessable:
      description: Unsafe path (traversal or symlink escape)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    PayloadTooLarge:
      description: Body or file exceeds the configured cap
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InsufficientStorage:
      description: Disk quota exceeded for the workspace
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unavailable:
      description: Sandbox backend (nsjail) unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    ErrorCode:
      type: string
      enum:
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - validation
        - unprocessable
        - payload_too_large
        - insufficient_storage
        - timeout
        - unavailable
        - internal
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            details:
              type: object
              additionalProperties: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, examples: [ok] }
    Ready:
      type: object
      required: [status, nsjail, data_dir]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        nsjail: { type: boolean }
        data_dir: { type: boolean }
    Meta:
      type: object
      required: [version, api_version, runtimes, limits_defaults]
      properties:
        version: { type: string, examples: ["0.0.5"] }
        api_version: { type: string, examples: [v1] }
        runtimes:
          type: array
          items: { type: string }
          examples: [[python3]]
        limits_defaults: { $ref: "#/components/schemas/Limits" }
    Limits:
      type: object
      properties:
        cpu_cores: { type: number, format: float }
        memory_mb: { type: integer }
        disk_mb: { type: integer }
        max_wall_time_sec: { type: integer }
        max_runs: { type: integer }
        allow_net: { type: boolean }
    Workspace:
      type: object
      required: [id, owner_id, name, created_at, status, limits]
      properties:
        id: { type: string, examples: ["ws_01H..."] }
        owner_id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        status: { type: string, enum: [active, deleted] }
        limits: { $ref: "#/components/schemas/Limits" }
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        limits: { $ref: "#/components/schemas/Limits" }
    Entry:
      type: object
      required: [name, path, type, size, mod_time]
      properties:
        name: { type: string }
        path: { type: string }
        type: { type: string, enum: [file, dir, symlink] }
        size: { type: integer, format: int64 }
        mod_time: { type: string, format: date-time }
    FileContentMeta:
      type: object
      required: [path, content, encoding, size]
      properties:
        path: { type: string }
        content: { type: string }
        encoding: { type: string, enum: [text, base64] }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        content_type: { type: string }
        truncated: { type: boolean }
    PutFileRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
        encoding: { type: string, enum: [text, base64], default: text }
    ExecRequest:
      type: object
      required: [cmd]
      properties:
        cmd:
          type: array
          minItems: 1
          items: { type: string }
        cwd: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        timeout_sec: { type: integer }
        stdin: { type: string }
    ExecResult:
      type: object
      required: [exit_code, stdout, stderr, duration_ms, truncated]
      properties:
        exit_code: { type: integer }
        stdout: { type: string }
        stderr: { type: string }
        duration_ms: { type: integer, format: int64 }
        truncated: { type: boolean }
    CreateRunRequest:
      oneOf:
        - $ref: "#/components/schemas/CreateRunFile"
        - $ref: "#/components/schemas/CreateRunCommand"
    CreateRunFile:
      type: object
      required: [kind, file]
      properties:
        kind: { type: string, const: file }
        file: { type: string }
        args:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        timeout_sec: { type: integer }
    CreateRunCommand:
      type: object
      required: [kind, argv]
      properties:
        kind: { type: string, const: command }
        argv:
          type: array
          minItems: 1
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        timeout_sec: { type: integer }
    Run:
      type: object
      required: [id, workspace_id, kind, argv, status, started_at, logs]
      properties:
        id: { type: string, examples: ["run_01H..."] }
        workspace_id: { type: string }
        kind: { type: string, enum: [file, command] }
        argv:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [queued, running, exited, killed, timeout, failed]
        exit_code: { type: [integer, "null"] }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        logs: { $ref: "#/components/schemas/RunLogs" }
    RunLogs:
      type: object
      required: [stdout_bytes, stderr_bytes, truncated]
      properties:
        stdout_bytes: { type: integer, format: int64 }
        stderr_bytes: { type: integer, format: int64 }
        truncated: { type: boolean }
    LogChunk:
      type: object
      required: [data, offset, next, eof, truncated]
      properties:
        data: { type: string }
        offset: { type: integer, format: int64 }
        next: { type: integer, format: int64 }
        eof: { type: boolean }
        truncated: { type: boolean }
