openapi: 3.1.0
info:
  title: sandboxd API
  version: 0.0.5
  description: |
    Secure per-user code execution backend. All `/v1` endpoints require a
    static bearer API key. All timestamps are RFC3339 UTC.
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: Meta
  - name: Workspaces
  - name: Files
  - name: Exec
  - name: Runs
  - name: Sessions
  - name: Packages

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: gethealthz
      tags: [Meta]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      operationId: getreadyz
      tags: [Meta]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
  /metrics:
    get:
      operationId: getmetrics
      tags: [Meta]
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema: { type: string }
  /v1/meta:
    get:
      operationId: getv1_meta
      tags: [Meta]
      summary: Service metadata
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/workspaces:
    post:
      operationId: postv1_workspaces
      tags: [Workspaces]
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties:
                  workspace: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
    get:
      operationId: getv1_workspaces
      tags: [Workspaces]
      summary: List the caller's workspaces
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getv1_workspaces_workspaceId
      tags: [Workspaces]
      summary: Get a workspace
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties:
                  workspace: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: patchv1_workspaces_workspaceId
      tags: [Workspaces]
      summary: Update a workspace's name and/or limits without recreating it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchWorkspaceRequest" }
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties:
                  workspace: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      operationId: deletev1_workspaces_workspaceId
      tags: [Workspaces]
      summary: Delete a workspace and all its runs/files
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workspaces/{workspaceId}/suspend:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: postv1_workspaces_workspaceId_suspend
      tags: [Workspaces]
      summary: Suspend a workspace (refuse new work, stop running runs)
      responses:
        "200":
          description: Suspended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceAction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{workspaceId}/resume:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: postv1_workspaces_workspaceId_resume
      tags: [Workspaces]
      summary: Resume a suspended workspace
      responses:
        "200":
          description: Resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceAction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{workspaceId}/stop:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: postv1_workspaces_workspaceId_stop
      tags: [Workspaces]
      summary: Stop every running/queued run, leaving the workspace active
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceAction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{workspaceId}/usage:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getv1_workspaces_workspaceId_usage
      tags: [Workspaces]
      summary: Disk usage, run counters and effective limits
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceUsage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workspaces/{workspaceId}/packages:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getv1_workspaces_workspaceId_packages
      tags: [Packages]
      summary: List packages installed in the workspace's private tier
      responses:
        "200":
          description: Private-tier packages and shared-tier status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WorkspaceSuspended" }
    delete:
      operationId: deletev1_workspaces_workspaceId_packages
      tags: [Packages]
      summary: Remove one package (?name=) or all packages (?all=true)
      parameters:
        - name: name
          in: query
          required: false
          description: Remove a single distribution by name (PEP 503 normalized).
          schema: { type: string }
        - name: all
          in: query
          required: false
          description: The exact value "true" removes every entry in the private tier. Required (as an alternative to name) to remove everything.
          schema: { type: string, enum: ["true"] }
      responses:
        "204":
          description: A single package was removed
        "200":
          description: All packages were removed
          content:
            application/json:
              schema:
                type: object
                required: [removed, all]
                properties:
                  removed: { type: integer }
                  all: { type: boolean }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WorkspaceSuspended" }

  /v1/workspaces/{workspaceId}/packages/install:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: postv1_workspaces_workspaceId_packages_install
      tags: [Packages]
      summary: Install requirement specifiers into the private tier (runs pip in the sandbox)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallPackagesRequest" }
      responses:
        "200":
          description: pip result (exit code, captured output, timing)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallPackagesResult" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WorkspaceSuspended" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/workspaces/{workspaceId}/files:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getv1_workspaces_workspaceId_files
      tags: [Files]
      summary: List a directory as a bounded page
      description: "Directories first, then files, each sorted by name byte-wise. A page is bounded by caps.file_list_max; count/total/truncated let a client page."
      parameters:
        - name: path
          in: query
          schema: { type: string, default: "/" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryListing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      operationId: deletev1_workspaces_workspaceId_files
      tags: [Files]
      summary: Delete a file or directory
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/workspaces/{workspaceId}/files/stat:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getv1_workspaces_workspaceId_files_stat
      tags: [Files]
      summary: Stat a single path
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Entry metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatEntry" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/workspaces/{workspaceId}/files/content:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getv1_workspaces_workspaceId_files_content
      tags: [Files]
      summary: Read a file (whole or a range)
      description: "Byte params (offset/limit) and line params (start_line/end_line) are mutually exclusive. sha256 is the hash of exactly the returned bytes; whole_file is true only when the response contains the entire file."
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
        - name: encoding
          in: query
          schema: { type: string, enum: [text, base64] }
        - name: meta
          in: query
          schema: { type: boolean }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          description: "Maximum bytes; must not exceed caps.file_read_mb."
          schema: { type: integer, minimum: 0 }
        - name: start_line
          in: query
          schema: { type: integer, minimum: 1 }
        - name: end_line
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: File bytes or JSON metadata wrapper
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FileContentMeta"
                  - $ref: "#/components/schemas/FileLinesMeta"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    put:
      operationId: putv1_workspaces_workspaceId_files_content
      tags: [Files]
      summary: Write a file
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutFileRequest" }
      responses:
        "204": { description: Written }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "507": { $ref: "#/components/responses/InsufficientStorage" }
  /v1/workspaces/{workspaceId}/files/download:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getv1_workspaces_workspaceId_files_download
      tags: [Files]
      summary: Download the entire file
      description: "Streams the whole file with constant memory. Exempt from caps.file_read_mb (that cap governs inline viewing); still bounded by the workspace disk quota."
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/workspaces/{workspaceId}/files/mkdir:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: postv1_workspaces_workspaceId_files_mkdir
      tags: [Files]
      summary: Create a directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
      responses:
        "201": { description: Created }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/workspaces/{workspaceId}/files/rename:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: postv1_workspaces_workspaceId_files_rename
      tags: [Files]
      summary: Rename or move a path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string }
                to: { type: string }
      responses:
        "204": { description: Renamed }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/workspaces/{workspaceId}/files/upload:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: postv1_workspaces_workspaceId_files_upload
      tags: [Files]
      summary: Upload a file (multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [path, file]
              properties:
                path: { type: string }
                file: { type: string, format: binary }
      responses:
        "201": { description: Uploaded }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "507": { $ref: "#/components/responses/InsufficientStorage" }

  /v1/workspaces/{workspaceId}/exec:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: postv1_workspaces_workspaceId_exec
      tags: [Exec]
      summary: Run a command synchronously
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecResult" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/WorkspaceSuspended" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/workspaces/{workspaceId}/runs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: postv1_workspaces_workspaceId_runs
      tags: [Runs]
      summary: Start an asynchronous run
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRunRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/WorkspaceSuspended" }
    get:
      operationId: getv1_workspaces_workspaceId_runs
      tags: [Runs]
      summary: List runs (filter and paginate)
      parameters:
        - name: status
          in: query
          description: Repeatable or comma-separated run statuses to keep.
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string, enum: [file, command] }
        - name: limit
          in: query
          description: Maximum runs to return; 0 means all remaining.
          schema: { type: integer, default: 0 }
        - name: offset
          in: query
          description: Number of matching runs to skip.
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                required: [runs, total]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
                  total: { type: integer, description: matches before pagination }
                  limit: { type: integer }
                  offset: { type: integer }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deletev1_workspaces_workspaceId_runs
      tags: [Runs]
      summary: Purge finished run history (refuses while a run is running)
      responses:
        "200":
          description: Purged
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{workspaceId}/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getv1_workspaces_workspaceId_runs_runId
      tags: [Runs]
      summary: Get a run
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deletev1_workspaces_workspaceId_runs_runId
      tags: [Runs]
      summary: Delete one finished run record
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/workspaces/{workspaceId}/runs/{runId}/stop:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: postv1_workspaces_workspaceId_runs_runId_stop
      tags: [Runs]
      summary: Stop a run (idempotent)
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/workspaces/{workspaceId}/runs/{runId}/logs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getv1_workspaces_workspaceId_runs_runId_logs
      tags: [Runs]
      summary: Poll run logs
      parameters:
        - name: stream
          in: query
          schema: { type: string, enum: [stdout, stderr], default: stdout }
        - name: offset
          in: query
          schema: { type: integer, format: int64, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, format: int64, default: 65536 }
      responses:
        "200":
          description: Log chunk
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogChunk" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workspaces/{workspaceId}/sessions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: postv1_workspaces_workspaceId_sessions
      tags: [Sessions]
      summary: Start an interactive terminal session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SessionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      operationId: getv1_workspaces_workspaceId_sessions
      tags: [Sessions]
      summary: List sessions (filter and paginate)
      parameters:
        - name: status
          in: query
          description: "Repeatable or comma-separated session statuses to keep (running, exited, killed, timed_out, failed)."
          schema: { type: string }
        - name: limit
          in: query
          description: Maximum sessions to return; 0 means all remaining.
          schema: { type: integer, default: 0 }
        - name: offset
          in: query
          description: Number of matching sessions to skip.
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                required: [sessions, total]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
                  total: { type: integer, description: matches before pagination }
                  limit: { type: integer }
                  offset: { type: integer }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/workspaces/{workspaceId}/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getv1_workspaces_workspaceId_sessions_sessionId
      tags: [Sessions]
      summary: Get a session
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deletev1_workspaces_workspaceId_sessions_sessionId
      tags: [Sessions]
      summary: Close a session gracefully (idempotent)
      responses:
        "200":
          description: Closed (changed=false when it was already terminal)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionAction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workspaces/{workspaceId}/sessions/{sessionId}/input:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: postv1_workspaces_workspaceId_sessions_sessionId_input
      tags: [Sessions]
      summary: Write raw bytes to the session PTY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: string, description: "Raw bytes written to the PTY; never interpreted as a control message." }
      responses:
        "204": { description: Written }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SessionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /v1/workspaces/{workspaceId}/sessions/{sessionId}/signal:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: postv1_workspaces_workspaceId_sessions_sessionId_signal
      tags: [Sessions]
      summary: Signal the session foreground process group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signal]
              properties:
                signal: { type: string, enum: [INT, TERM, QUIT, HUP] }
      responses:
        "204": { description: Signalled }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SessionConflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/workspaces/{workspaceId}/sessions/{sessionId}/resize:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: postv1_workspaces_workspaceId_sessions_sessionId_resize
      tags: [Sessions]
      summary: Resize the session PTY (TIOCSWINSZ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cols, rows]
              properties:
                cols: { type: integer, minimum: 1, maximum: 1000 }
                rows: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "204": { description: Resized }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SessionConflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/workspaces/{workspaceId}/sessions/{sessionId}/output:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getv1_workspaces_workspaceId_sessions_sessionId_output
      tags: [Sessions]
      summary: Poll session PTY output by byte offset
      parameters:
        - name: offset
          in: query
          schema: { type: integer, format: int64, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, format: int64, default: 65536 }
      responses:
        "200":
          description: Output chunk (same shape as run logs)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogChunk" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SessionConflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, pattern: "^ws_[0-9A-HJKMNP-TV-Z]{26}$" }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, pattern: "^run_[0-9A-HJKMNP-TV-Z]{26}$" }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, pattern: "^ses_[0-9A-HJKMNP-TV-Z]{26}$" }
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Caller does not own the resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Validation:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unprocessable:
      description: Unsafe path (traversal or symlink escape)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    PayloadTooLarge:
      description: Body or file exceeds the configured cap
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InsufficientStorage:
      description: Disk quota exceeded for the workspace
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unavailable:
      description: Sandbox backend (nsjail) unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Operation conflicts with current state (e.g. purging while a run is running)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    WorkspaceSuspended:
      description: Work refused because the workspace is suspended
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    SessionConflict:
      description: >
        A 409 for a session route: `workspace_suspended` (the workspace is
        suspended), `too_many_sessions` (the per-workspace cap is reached), or
        `session_ended` (the session is already terminal).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    ErrorCode:
      type: string
      enum:
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - workspace_suspended
        - too_many_sessions
        - session_ended
        - validation
        - unprocessable
        - not_directory
        - payload_too_large
        - insufficient_storage
        - timeout
        - unavailable
        - internal
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            details:
              type: object
              additionalProperties: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, examples: [ok] }
    Ready:
      type: object
      required: [status, nsjail, cgroups, data_dir]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        nsjail: { type: boolean }
        cgroups: { type: boolean, description: "cgroup v2 usable (requires --cgroupns=host)" }
        data_dir: { type: boolean }
    Meta:
      type: object
      required: [version, api_version, runtimes, limits_defaults]
      properties:
        version: { type: string, examples: ["0.0.5"] }
        api_version: { type: string, examples: [v1] }
        runtimes:
          type: array
          items: { type: string }
          examples: [[python3]]
        interpreters:
          type: array
          description: "Allowlist of interpreters a kind=file run may use (with an explicit interpreter field)."
          items: { type: string }
        runnable_extensions:
          type: array
          description: "File extensions that map to an allowlisted interpreter (what a file's `runnable` field reports)."
          items: { type: string }
        limits_defaults: { $ref: "#/components/schemas/Limits" }
        limits_maxima:
          allOf: [{ $ref: "#/components/schemas/Limits" }]
          description: Server-enforced maxima for per-workspace limits.
    Limits:
      type: object
      properties:
        cpu_cores: { type: number, format: float }
        memory_mb: { type: integer }
        disk_mb: { type: integer }
        max_wall_time_sec: { type: integer }
        max_runs: { type: integer }
        allow_net: { type: boolean }
        allow_unlimited_runs:
          type: boolean
          description: "Workspace opt-in for wall-clock-unbounded runs (no_timeout:true). A true value is rejected with 422 unless max_limits.allow_unlimited_runs is also true."
    Workspace:
      type: object
      required: [id, owner_id, name, created_at, status, limits]
      properties:
        id: { type: string, examples: ["ws_01H..."] }
        owner_id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        status: { type: string, enum: [active, suspended, deleted] }
        limits: { $ref: "#/components/schemas/Limits" }
        last_activity_at: { type: string, format: date-time }
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        limits: { $ref: "#/components/schemas/Limits" }
    PatchLimits:
      type: object
      description: "Partial limits update. An absent field or explicit null keeps the current value."
      properties:
        cpu_cores: { type: [number, "null"], format: float }
        memory_mb: { type: [integer, "null"] }
        disk_mb: { type: [integer, "null"] }
        max_wall_time_sec: { type: [integer, "null"] }
        max_runs: { type: [integer, "null"] }
        allow_net: { type: [boolean, "null"] }
        allow_unlimited_runs: { type: [boolean, "null"] }
    PatchWorkspaceRequest:
      type: object
      description: "Partial workspace update; absent fields keep their current value."
      properties:
        name: { type: [string, "null"], minLength: 1, maxLength: 128 }
        limits: { $ref: "#/components/schemas/PatchLimits" }
    WorkspaceAction:
      type: object
      required: [workspace]
      properties:
        workspace: { $ref: "#/components/schemas/Workspace" }
        changed:
          type: boolean
          description: Whether the status actually changed (idempotency signal).
        stopped_run_ids:
          type: array
          items: { type: string }
        stopped_run_count: { type: integer }
        stopped_session_ids:
          type: array
          description: "Live terminal sessions ended by this action (stop; also suspend)."
          items: { type: string }
        stopped_session_count: { type: integer }
    WorkspaceUsage:
      type: object
      required: [workspace_id, status, disk_bytes, disk_mb, runs_total, active_runs, max_runs, limits]
      properties:
        workspace_id: { type: string }
        status: { type: string, enum: [active, suspended] }
        created_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
        disk_bytes: { type: integer, format: int64 }
        disk_bytes_complete:
          type: boolean
          description: "false when the bounded walk stopped early, making disk_bytes a lower bound."
        disk_mb: { type: integer }
        disk_percent: { type: number, format: float }
        runs_total: { type: integer }
        runs_by_status:
          type: object
          additionalProperties: { type: integer }
        active_runs: { type: integer }
        max_runs: { type: integer }
        limits: { $ref: "#/components/schemas/Limits" }
    Entry:
      type: object
      required: [name, path, type, size, mode, mod_time]
      properties:
        name: { type: string }
        path: { type: string }
        type: { type: string, enum: [file, dir, symlink] }
        size: { type: integer, format: int64, description: "Entry size in bytes; 0 for a directory." }
        mode: { type: string, description: "Octal permission string, e.g. 0644." }
        mod_time: { type: string, format: date-time }
        target: { type: string, description: "Raw link target; only for a symlink." }
        target_inside: { type: boolean, description: "Whether a symlink resolves inside the workspace; only for a symlink." }
        runnable:
          type: string
          description: "Interpreter that runs this regular file by extension (e.g. python3); omitted when no interpreter is registered. A UI can offer \"run this file\" only where it is present."
    DirectoryListing:
      type: object
      required: [path, entries, count, total, truncated]
      properties:
        path: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
        count: { type: integer, description: "Number of entries in this page." }
        total: { type: integer, description: "Total number of children (for paging)." }
        truncated: { type: boolean, description: "True when entries were omitted by the page size." }
    StatEntry:
      type: object
      required: [name, path, type, size, mode, mod_time]
      properties:
        name: { type: string }
        path: { type: string }
        type: { type: string, enum: [file, dir, symlink] }
        size: { type: integer, format: int64 }
        mode: { type: string }
        mod_time: { type: string, format: date-time }
        target: { type: string, description: "Raw link target; only for a symlink." }
        target_inside: { type: boolean, description: "Whether a symlink resolves inside the workspace." }
        content_type: { type: string, description: "Detected content type; only for a regular file." }
        sha256:
          type: string
          description: "Hex sha256 of the whole file; only for a regular file."
        binary:
          type: boolean
          description: "Bounded binary detection (NUL or invalid UTF-8 in a leading sample); only for a regular file."
        runnable:
          type: string
          description: "Interpreter that runs this regular file by extension (e.g. python3); omitted when none is registered."
    FileContentMeta:
      type: object
      required: [path, content, encoding, size, total_size, range, whole_file, sha256, truncated, binary]
      description: "Byte-range read. sha256 is the hash of exactly the returned bytes; whole_file is true only when the response contains the entire file."
      properties:
        path: { type: string }
        content: { type: string }
        encoding: { type: string, enum: [text, base64] }
        size: { type: integer, format: int64, description: "Total file size in bytes." }
        total_size: { type: integer, format: int64 }
        range:
          type: object
          required: [offset, length]
          properties:
            offset: { type: integer, format: int64 }
            length: { type: integer, format: int64 }
        whole_file: { type: boolean }
        sha256: { type: string }
        content_type: { type: string }
        truncated: { type: boolean }
        binary: { type: boolean }
    FileLinesMeta:
      type: object
      required: [path, content, encoding, start_line, end_line, line_count, total_lines, sha256, truncated, binary]
      description: "Line-range read (start_line/end_line, 1-based inclusive). sha256 is the hash of exactly the returned bytes."
      properties:
        path: { type: string }
        content: { type: string }
        encoding: { type: string, enum: [text, base64] }
        start_line: { type: integer, format: int64 }
        end_line: { type: integer, format: int64 }
        line_count: { type: integer, format: int64 }
        total_lines: { type: integer, format: int64 }
        sha256: { type: string }
        truncated: { type: boolean }
        binary: { type: boolean }
    PutFileRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, description: "Required. An explicit empty string writes a 0-byte file." }
        encoding: { type: string, enum: [text, base64], default: text }
    ExecRequest:
      type: object
      required: [cmd]
      properties:
        cmd:
          type: array
          minItems: 1
          items: { type: string }
        cwd: { type: string, description: "Working directory inside the sandbox, relative to the workspace root; defaults to the workspace root. Must not escape it." }
        env:
          type: object
          description: "User environment variables. Only an allowlist is passed through (PYTHONPATH, PYTHONUNBUFFERED, PYTHONDONTWRITEBYTECODE, PYTHONHASHSEED, LANG, LC_ALL, LC_CTYPE, TZ); loader-injection names (LD_*, DYLD_*, GLIBC_TUNABLES) are dropped."
          additionalProperties: { type: string }
        timeout_sec: { type: integer }
        stdin: { type: string }
    ExecResult:
      type: object
      required: [exit_code, stdout, stderr, duration_ms, truncated]
      properties:
        exit_code: { type: integer }
        stdout: { type: string }
        stderr: { type: string }
        duration_ms: { type: integer, format: int64 }
        truncated: { type: boolean }
    CreateRunRequest:
      oneOf:
        - $ref: "#/components/schemas/CreateRunFile"
        - $ref: "#/components/schemas/CreateRunCommand"
    CreateRunFile:
      type: object
      required: [kind, file]
      properties:
        kind: { type: string, const: file }
        file: { type: string, description: "Path relative to the workspace root. Its extension must map to an allowlisted interpreter, or `interpreter` must be given." }
        args:
          type: array
          items: { type: string }
        cwd: { type: string, description: "Working directory relative to the workspace root; must exist and be a directory at request time (else 422). Not a relative-path prefix for file." }
        interpreter: { type: string, description: "Override the extension-derived interpreter; must be in the allowlist (see /v1/meta interpreters)." }
        env:
          type: object
          description: "User environment variables; only the allowlist is passed through (see ExecRequest)."
          additionalProperties: { type: string }
        timeout_sec: { type: integer }
        no_timeout:
          type: boolean
          description: "Request a wall-clock-unbounded run (distinct from timeout_sec:0). Permitted only when both max_limits.allow_unlimited_runs and the workspace limits.allow_unlimited_runs are true; else 422."
    CreateRunCommand:
      type: object
      required: [kind, argv]
      properties:
        kind: { type: string, const: command }
        argv:
          type: array
          minItems: 1
          items: { type: string }
        cwd: { type: string, description: "Working directory relative to the workspace root; must exist and be a directory at request time (else 422)." }
        env:
          type: object
          description: "User environment variables; only the allowlist is passed through (see ExecRequest)."
          additionalProperties: { type: string }
        timeout_sec: { type: integer }
        no_timeout:
          type: boolean
          description: "Request a wall-clock-unbounded run (distinct from timeout_sec:0). Permitted only when both max_limits.allow_unlimited_runs and the workspace limits.allow_unlimited_runs are true; else 422."
    Run:
      type: object
      required: [id, workspace_id, kind, argv, status, started_at, logs]
      properties:
        id: { type: string, examples: ["run_01H..."] }
        workspace_id: { type: string }
        kind: { type: string, enum: [file, command] }
        argv:
          type: array
          items: { type: string }
        cwd: { type: string, description: "Working directory relative to the workspace root (leading-slash normalized; / is the root)." }
        interpreter: { type: string, description: "Interpreter used for a kind=file run; omitted otherwise." }
        timeout_sec: { type: [integer, "null"], description: "Effective wall-clock limit in seconds; null exactly when unlimited is true (an unbounded run is never stored with a fake finite number)." }
        unlimited: { type: boolean, description: "True when the run has no wall-clock limit." }
        status:
          type: string
          enum: [queued, running, exited, killed, timeout, failed, interrupted]
        exit_code: { type: [integer, "null"] }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        logs: { $ref: "#/components/schemas/RunLogs" }
    RunLogs:
      type: object
      required: [stdout_bytes, stderr_bytes, truncated]
      properties:
        stdout_bytes: { type: integer, format: int64 }
        stderr_bytes: { type: integer, format: int64 }
        truncated: { type: boolean }
    LogChunk:
      type: object
      required: [data, offset, next, eof, truncated]
      properties:
        data: { type: string }
        offset: { type: integer, format: int64 }
        next: { type: integer, format: int64 }
        eof: { type: boolean }
        truncated: { type: boolean }
    PackageList:
      type: object
      required: [packages, count, truncated, shared_enabled, shared_available, private_path]
      properties:
        packages:
          type: array
          description: Distributions installed in the workspace's private tier, sorted by name.
          items: { $ref: "#/components/schemas/PrivatePackage" }
        count: { type: integer }
        truncated:
          type: boolean
          description: "true when the enumeration hit its 1000-distribution bound; the list is then a prefix."
        shared_enabled:
          type: boolean
          description: Whether the shared tier is configured.
        shared_available:
          type: boolean
          description: "Live probe: the shared directory exists and is a readable directory. A false value only degrades a run to private-only."
        shared_path:
          type: string
          description: "Sandbox path of the shared tier (/opt/python/shared), or empty when unavailable."
        private_path:
          type: string
          description: "Sandbox path of the workspace's private tier (/opt/python/private)."
    PrivatePackage:
      type: object
      required: [name, version]
      properties:
        name: { type: string }
        version: { type: string }
    InstallPackagesRequest:
      type: object
      required: [packages]
      properties:
        packages:
          type: array
          minItems: 1
          description: "Requirement specifiers. Each is validated (no shell metacharacters, no leading -, no paths, <= 200 chars) and passed to pip as an individual argv element."
          items: { type: string }
    InstallPackagesResult:
      type: object
      required: [exit_code, output, timed_out, truncated, duration_ms, target]
      properties:
        exit_code: { type: integer }
        output: { type: string, description: "Combined stdout+stderr, capped at packages.install_output_kb." }
        stdout: { type: string, description: "Alias of output." }
        timed_out: { type: boolean }
        truncated: { type: boolean }
        duration_ms: { type: integer, format: int64 }
        target: { type: string, description: "Always /opt/python/private." }
    CreateSessionRequest:
      type: object
      properties:
        shell: { type: string, description: "Absolute shell path in the sandbox image; defaults to sessions.shell." }
        cwd: { type: string, description: "Working directory inside the sandbox, relative to the workspace root; must exist and must not escape." }
        cols: { type: integer, minimum: 1, maximum: 1000, default: 80 }
        rows: { type: integer, minimum: 1, maximum: 1000, default: 24 }
        env:
          type: object
          description: "User environment variables; only the allowlist is passed through (see ExecRequest)."
          additionalProperties: { type: string }
        timeout_sec: { type: integer, description: "Optional absolute-lifetime ceiling; clamped to sessions.lifetime_sec." }
    Session:
      type: object
      required: [id, workspace_id, shell, cwd, cols, rows, status, created_at, last_activity_at, output_bytes, output_truncated]
      properties:
        id: { type: string, examples: ["ses_01H..."] }
        workspace_id: { type: string }
        shell: { type: string }
        cwd: { type: string }
        cols: { type: integer }
        rows: { type: integer }
        status:
          type: string
          enum: [running, exited, killed, timed_out, failed]
        created_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        exit_code: { type: [integer, "null"] }
        reason:
          type: string
          description: "Terminal reason: shell_exited, user_closed, idle_timeout, lifetime, workspace_deleted, workspace_suspended, workspace_stopped, service_shutdown, interrupted, sandbox_unavailable."
        diagnostic:
          type: string
          description: "Only on a failed session: the actionable cause (e.g. a PTY allocation failure). A failed session never leaves a traceback in its output."
        output_bytes: { type: integer, format: int64 }
        output_truncated: { type: boolean, description: "true when the output cap (sessions.output_kb) was reached." }
    SessionAction:
      type: object
      required: [session]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        changed:
          type: boolean
          description: "false when the session was already terminal (idempotency signal)."
